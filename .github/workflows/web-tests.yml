name: Web Tests

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "main.py"
      - "web-tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/web-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "main.py"
      - "web-tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/web-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web tests
        run: npx playwright test
